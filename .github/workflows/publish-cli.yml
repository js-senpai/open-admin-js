name: Publish verified OpenAdminJS candidate
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicit approval to publish the tested candidate to npm
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: openadminjs-candidate
          path: candidate
      - name: Publish the exact tested archive
        working-directory: candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          version=$(tar -xOzf ./*.tgz package/package.json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          npm publish ./*.tgz --tag "$tag" --access public --provenance --ignore-scripts
