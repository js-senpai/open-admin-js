name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Unit + CLI e2e tests across every supported Node.js version (Linux).
  cli:
    name: CLI tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck CLI
        run: pnpm --filter openadminjs typecheck
      - name: Build CLI
        run: pnpm --filter openadminjs build
      - name: Unit + CLI e2e tests
        run: pnpm --filter openadminjs test

  # Full monorepo checks + Prisma integration against a real PostgreSQL.
  checks:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openadminjs
          POSTGRES_PASSWORD: openadminjs
          POSTGRES_DB: openadminjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openadminjs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openadminjs:openadminjs@localhost:5432/openadminjs?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prisma integration (validate + migrate deploy)
        run: |
          pnpm exec prisma validate --schema prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm build
      - run: pnpm security:check
      - run: pnpm e2e

  # Database matrix: verify a generated project's schema + migrations for every
  # advertised database (PostgreSQL + MySQL) against a real container.
  database-matrix:
    needs: pack
    timeout-minutes: 30
    name: DB integration (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgresql
            image: postgres:16
            port: 5432
            url: postgresql://openadminjs:openadminjs@localhost:5432/openadminjs?schema=public
          - db: mysql
            image: mysql:8
            port: 3306
            url: mysql://openadminjs:openadminjs@localhost:3306/openadminjs
          - db: sqlite
            image: ""
            port: 0
            url: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start ${{ matrix.db }}
        if: matrix.db != 'sqlite'
        run: |
          if [ "${{ matrix.db }}" = "postgresql" ]; then
            docker run -d --name db -p ${{ matrix.port }}:5432 \
              -e POSTGRES_USER=openadminjs -e POSTGRES_PASSWORD=openadminjs -e POSTGRES_DB=openadminjs \
              ${{ matrix.image }}
          else
            docker run -d --name db -p ${{ matrix.port }}:3306 \
              -e MYSQL_ROOT_PASSWORD=root -e MYSQL_USER=openadminjs -e MYSQL_PASSWORD=openadminjs -e MYSQL_DATABASE=openadminjs \
              ${{ matrix.image }}
          fi
      - uses: actions/download-artifact@v4
        with:
          name: openadminjs-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install actual release candidate
        env:
          QA_ADMIN_PASSWORD: quality-test-passphrase-2026
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          sha256sum -c SHA256SUMS
          mkdir -p "$RUNNER_TEMP/test-runner"
          cd "$RUNNER_TEMP/test-runner"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/candidate/*.tgz playwright@1.56.1
          cp "$GITHUB_WORKSPACE/scripts/installed-smoke.mjs" .
          npx playwright install --with-deps chromium
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/test-runner/node_modules/.bin/openadminjs" create it-app --pm pnpm --db "${{ matrix.db }}" --db-url "${{ matrix.url }}" --admin-email admin@example.test --admin-password-env QA_ADMIN_PASSWORD --skip-redis --no-git --non-interactive --no-install
      - name: Wait for DB
        if: matrix.db != 'sqlite'
        run: |
          for i in $(seq 1 30); do
            if [ "${{ matrix.db }}" = "postgresql" ]; then
              docker exec db pg_isready -U openadminjs && break
            else
              docker exec db mysqladmin ping -uopenadminjs -popenadminjs --silent && break
            fi
            sleep 2
          done
      - name: prisma validate + migrate + generate
        working-directory: ${{ runner.temp }}/it-app
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: |
          pnpm install
          pnpm exec prisma validate --schema prisma/schema.prisma
          # migrate dev is interactive (fails non-interactively) and needs a shadow DB
          # (MySQL users often can't create one → P3014). Use the non-interactive path:
          # PostgreSQL ships a baseline migration → deploy it; MySQL/SQLite have no
          # migration history → push the schema directly (no shadow DB required).
          if [ "${{ matrix.db }}" = "postgresql" ]; then
            pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          else
            pnpm exec prisma db push --schema prisma/schema.prisma --skip-generate
          fi
          pnpm exec prisma generate --schema prisma/schema.prisma
          pnpm db:seed

      - name: Build scaffold and exercise real HTTP and browser flows
        env:
          QA_ADMIN_PASSWORD: quality-test-passphrase-2026
        run: |
          cd "$RUNNER_TEMP/it-app"
          pnpm build
          node "$RUNNER_TEMP/test-runner/installed-smoke.mjs" "$PWD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.db }}
          path: ${{ runner.temp }}/smoke-results
          if-no-files-found: ignore

  pack:
    name: Build and inspect release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openadminjs build
      - name: Pack and validate contents
        working-directory: packages/cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          tar -tzf ./*.tgz > contents.txt
          if grep -E '(^|/)\.env($|\.)' contents.txt | grep -vE '/\.env\.example$'; then
            echo "::error::Real env file in candidate"; exit 1
          fi
          if grep -E '(^|/)(node_modules|coverage|\.next|\.git)/|\.(test|spec)\.[cm]?[jt]sx?$|\.(db|sqlite|pem|key)$' contents.txt; then
            echo "::error::Unexpected file in candidate"; exit 1
          fi
          grep -q '^package/dist/index.js$' contents.txt
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openadminjs-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
