name: Notify IndexNow after Pages deployment
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-pages
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/submit-indexnow.mjs
