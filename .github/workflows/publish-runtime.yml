name: Publish independently versioned runtime packages
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
        description: Explicit approval to publish verified packages
      packages:
        type: string
        required: true
        default: all
        description: all or comma-separated runtime package names
      dist_tag:
        type: choice
        options: [next, latest]
        default: next
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-24.04
    environment: npm-runtime-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: openadminjs-runtime-packages
          path: runtime-artifacts
      - name: Publish selected exact tested archives
        env:
          RUNTIME_PACKAGES: ${{ inputs.packages }}
          RUNTIME_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm --version
          node scripts/publish-runtime.mjs runtime-artifacts
