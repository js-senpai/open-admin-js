# Local contributor database only; production uses compose.yaml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: openadminjs
      POSTGRES_USER: openadminjs
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["openadmin-dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openadminjs -d openadminjs"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  openadmin-dev:
